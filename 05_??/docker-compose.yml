version: "3.8"

services:
  eoe-clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: eoe-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=default
      - MAX_MEMORY_USAGE=1073741824
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  eoe-fastapi:
    build: ./backend
    container_name: eoe-fastapi
    ports:
      - "8086:8086"
    env_file:
      - ./backend/.env
    depends_on:
      - eoe-clickhouse

  eoe-frontend:
    build: ./frontend
    container_name: eoe-frontend
    ports:
      - "5179:80"
